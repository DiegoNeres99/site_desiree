version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: desiree_postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${DATABASE_USER:-root}
      POSTGRES_PASSWORD: ${DATABASE_PASS:-abc123}
      POSTGRES_DB: ${DATABASE_NAME:-desiree_db}
    volumes:
      # Volume persistente para os dados do banco
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER:-root}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: desiree_postgres_data
