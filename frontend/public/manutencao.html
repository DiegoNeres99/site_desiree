<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desiree Honório | Em manutenção</title>
    <meta
      name="description"
      content="Estamos ajustando alguns detalhes para te atender melhor. Em breve o site estará no ar."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Manrope:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-1: #fff8f3;
        --bg-2: #f6e8df;
        --card: rgba(255, 255, 255, 0.7);
        --text: #2d1b1b;
        --muted: #6f5050;
        --brand: #b7675a;
        --brand-dark: #8f4a3f;
        --ring: rgba(183, 103, 90, 0.25);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Manrope", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 12% 20%, #ffe7d2 0%, transparent 42%),
          radial-gradient(circle at 88% 10%, #f3d4d4 0%, transparent 35%),
          linear-gradient(145deg, var(--bg-1), var(--bg-2));
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(720px, 100%);
        background: var(--card);
        border: 1px solid rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(10px);
        border-radius: 24px;
        padding: 36px 24px;
        box-shadow: 0 20px 50px rgba(84, 45, 45, 0.12);
        text-align: center;
        animation: rise 420ms ease-out;
      }

      .label {
        display: inline-block;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid #f2ccc4;
        background: #fff4f0;
        color: #8c4f45;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0 0 12px;
        font-family: "Cormorant Garamond", serif;
        font-size: clamp(2rem, 4vw, 3rem);
        line-height: 1.05;
      }

      p {
        margin: 0 auto;
        max-width: 60ch;
        color: var(--muted);
        line-height: 1.65;
      }

      .actions {
        margin-top: 26px;
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn {
        text-decoration: none;
        border-radius: 12px;
        padding: 12px 16px;
        font-weight: 700;
        transition: 180ms ease;
        border: 1px solid transparent;
      }

      .btn-primary {
        background: var(--brand);
        color: #fff;
      }

      .btn-primary:hover {
        background: var(--brand-dark);
        transform: translateY(-1px);
      }

      .btn-secondary {
        color: var(--brand-dark);
        border-color: #e8bcb3;
        background: #fff;
      }

      .btn-secondary:hover {
        box-shadow: 0 0 0 4px var(--ring);
      }

      .meta {
        margin-top: 20px;
        font-size: 14px;
        color: #7a5c5c;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(6px) scale(0.995);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="label">Temporariamente indisponível</span>
      <h1>Estamos em manutenção</h1>
      <p>
        Estamos ajustando alguns detalhes para te atender ainda melhor.
        O site volta em breve. Se quiser agendar agora, fale direto no WhatsApp.
      </p>
      <div class="actions">
        <a
          class="btn btn-primary"
          href="https://wa.me/554399880294?text=Olá%2C%20gostaria%20de%20agendar%20um%20horário."
          target="_blank"
          rel="noopener noreferrer"
        >
          Chamar no WhatsApp
        </a>
        <a
          class="btn btn-secondary"
          href="https://www.instagram.com/desireehonorio/"
          target="_blank"
          rel="noopener noreferrer"
        >
          Ver Instagram
        </a>
      </div>
      <p class="meta">Desiree Honório • Arapongas/PR</p>
    </main>
  </body>
</html>
