<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desiree Honório | Página não encontrada</title>
    <meta
      name="description"
      content="A página que você tentou acessar não foi encontrada."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Manrope:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-1: #fff8f3;
        --bg-2: #f6e8df;
        --card: rgba(255, 255, 255, 0.7);
        --text: #2d1b1b;
        --muted: #6f5050;
        --brand: #b7675a;
        --brand-dark: #8f4a3f;
        --ring: rgba(183, 103, 90, 0.25);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Manrope", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 15% 20%, #ffe7d2 0%, transparent 42%),
          radial-gradient(circle at 85% 10%, #f3d4d4 0%, transparent 35%),
          linear-gradient(145deg, var(--bg-1), var(--bg-2));
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(700px, 100%);
        background: var(--card);
        border: 1px solid rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(10px);
        border-radius: 24px;
        padding: 36px 24px;
        box-shadow: 0 20px 50px rgba(84, 45, 45, 0.12);
        text-align: center;
      }

      .code {
        display: inline-block;
        margin-bottom: 16px;
        font-size: 13px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #8c4f45;
        background: #fff4f0;
        border: 1px solid #f2ccc4;
        border-radius: 999px;
        padding: 8px 12px;
      }

      h1 {
        margin: 0 0 12px;
        font-family: "Cormorant Garamond", serif;
        font-size: clamp(2rem, 4vw, 3rem);
        line-height: 1.05;
      }

      p {
        margin: 0 auto;
        max-width: 58ch;
        color: var(--muted);
        line-height: 1.65;
      }

      .actions {
        margin-top: 26px;
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn {
        text-decoration: none;
        border-radius: 12px;
        padding: 12px 16px;
        font-weight: 700;
        transition: 180ms ease;
      }

      .btn-primary {
        background: var(--brand);
        color: #fff;
      }

      .btn-primary:hover {
        background: var(--brand-dark);
      }

      .btn-secondary {
        color: var(--brand-dark);
        border: 1px solid #e8bcb3;
        background: #fff;
      }

      .btn-secondary:hover {
        box-shadow: 0 0 0 4px var(--ring);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="code">Erro 404</span>
      <h1>Página não encontrada</h1>
      <p>
        O link pode estar incompleto ou essa página foi movida. Você pode voltar
        para o início ou falar direto no WhatsApp para atendimento.
      </p>
      <div class="actions">
        <a class="btn btn-primary" href="/">Voltar para o início</a>
        <a
          class="btn btn-secondary"
          href="https://wa.me/554399880294?text=Olá%2C%20gostaria%20de%20agendar%20um%20horário."
          target="_blank"
          rel="noopener noreferrer"
        >
          Falar no WhatsApp
        </a>
      </div>
    </main>
  </body>
</html>
